<div class="pt-5 animate__animated animate__fadeIn">
  <h2 class="text-lg font-semibold text-gray-900">Projects</h2>

  <div class="flex flex-col gap-4 mb-3 mt-4">
    @for (project of projects.controls; track $index) {
      <div
        [formGroup]="getFormGroup($index)"
        class="border border-gray-200/80 p-4 flex flex-col gap-4 rounded-lg relative"
      >
        @if (projects.controls.length > 1) {
          <p-button
            size="small"
            icon="pi pi-trash"
            class="absolute top-1.5 right-1.5"
            (onClick)="remove.emit($index)"
            [rounded]="true"
            [text]="true"
            severity="danger"
          />
        }
        <app-input-field
          label="Project Name"
          formControlName="name"
          type="text"
          placeholder="Portfolio Website"
        ></app-input-field>
        <app-textarea
          label="Description"
          formControlName="description"
          placeholder="Describe your work experience..."
        />
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <app-input-field
            label="GitHub Link"
            type="text"
            formControlName="github"
            placeholder="http://github.com/yourusername/project"
          ></app-input-field>
          <app-input-field
            label="Live Demo URL"
            type="text"
            formControlName="liveDemo"
            placeholder="http://github.com/yourproject.live"
          ></app-input-field>
        </div>
      </div>
    }
    <p-button
      (onClick)="add.emit()"
      label="Add Project"
      icon="pi pi-plus"
      variant="outlined"
      severity="help"
      size="small"
    />
  </div>
</div>

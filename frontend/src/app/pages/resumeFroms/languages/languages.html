<div class="pt-5 animate__animated animate__fadeIn">
  <h2 class="text-lg font-semibold text-gray-900">Additional Info</h2>

  <div class="flex flex-col gap-4 mb-3 mt-4">
    @for (language of languages.controls; track $index) {
      <div
        [formGroup]="getFormGroup($index)"
        class="border border-gray-200/80 p-4 rounded-lg relative"
      >
        @if (languages.controls.length > 1) {
          <p-button
            size="small"
            icon="pi pi-trash"
            class="absolute top-1.5 right-1.5"
            (onClick)="remove.emit($index)"
            [rounded]="true"
            [text]="true"
            severity="danger"
          />
        }
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <app-input-field
            label="Languages"
            formControlName="name"
            type="text"
            placeholder="English"
          ></app-input-field>
          <app-input-field
            formControlName="level"
            label="Level"
            type="text"
            placeholder="Intermediate, expert..."
          ></app-input-field>
        </div>
      </div>
    }
    <p-button
      (onClick)="add.emit()"
      label="Add Language"
      icon="pi pi-plus"
      variant="outlined"
      severity="help"
      size="small"
    />
  </div>
</div>

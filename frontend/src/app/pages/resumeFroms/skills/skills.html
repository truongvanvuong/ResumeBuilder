<div class="pt-5 animate__animated animate__fadeIn">
  <h2 class="text-lg font-semibold text-gray-900">Skills</h2>

  <div class="flex flex-col gap-4 mb-3 mt-4">
    @for (sk of skills.controls; track $index) {
      <div
        [formGroup]="getFormGroup($index)"
        class="border border-gray-200/80 p-4 rounded-lg relative"
      >
        @if (skills.controls.length > 1) {
          <p-button
            size="small"
            icon="pi pi-trash"
            class="absolute top-1.5 right-1.5"
            (onClick)="remove.emit($index)"
            [rounded]="true"
            [text]="true"
            severity="danger"
          />
        }
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <app-input-field
            formControlName="name"
            label="Skill Name"
            type="text"
            placeholder="JavaScript"
          ></app-input-field>
          <app-input-field
            formControlName="level"
            label="Proficiency (optional)"
            type="text"
            placeholder="Expert"
          ></app-input-field>
        </div>
      </div>
    }
    <p-button
      label="Add Skill"
      icon="pi pi-plus"
      (onClick)="add.emit()"
      variant="outlined"
      severity="help"
      size="small"
    />
  </div>
</div>

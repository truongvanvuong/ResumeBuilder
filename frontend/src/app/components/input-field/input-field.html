<div class="flex flex-col gap-2.5 my-input">
  <label [for]="name" class="text-sm font-semibold text-slate-900">{{ label }}</label>
  <!-- Nếu là password thì dùng p-password -->
  @switch (type) {
    @case ('password') {
      <p-password
        fluid
        [toggleMask]="true"
        [feedback]="false"
        variant="filled"
        [attr.id]="name"
        [attr.name]="name"
        [(ngModel)]="value"
        (ngModelChange)="handleInput($event)"
        [disabled]="disabled"
        [placeholder]="placeholder"
        (onBlur)="onBlur()"
        [invalid]="isInvalid()"
        [minlength]="minlength"
      />
    }
    @case ('text') {
      <input
        pInputText
        fluid
        [invalid]="isInvalid()"
        variant="filled"
        [type]="type"
        [attr.id]="name"
        [attr.name]="name"
        [(ngModel)]="value"
        (ngModelChange)="handleInput($event)"
        [disabled]="disabled"
        [placeholder]="placeholder"
        (blur)="onBlur()"
      />
    }
    @case ('date') {
      <p-datepicker
        fluid
        autoZIndex
        [minDate]="minDate"
        [maxDate]="maxDate"
        [placeholder]="placeholder"
        appendTo="body"
        [dateFormat]="dateFormat"
        [(ngModel)]="value"
        (ngModelChange)="handleInput($event)"
        showIcon
        iconDisplay="input"
        [view]="view"
      />
    }
    @default {
      <input
        pInputText
        fluid
        [invalid]="isInvalid()"
        variant="filled"
        [type]="type"
        [attr.id]="name"
        [attr.name]="name"
        [(ngModel)]="value"
        (ngModelChange)="handleInput($event)"
        [disabled]="disabled"
        [placeholder]="placeholder"
        (blur)="onBlur()"
      />
    }
  }
  @if (isInvalid()) {
    <p-message severity="error" size="small" variant="simple">
      {{ getErrorMessage() }}
    </p-message>
  }
</div>

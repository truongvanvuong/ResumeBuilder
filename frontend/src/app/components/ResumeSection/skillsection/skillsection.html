<div class="my-2">
    @for(skill of skills; track $index) {
    <div class="flex items-center justify-between">
        <h3 class="text-x font-semibold text-gray-900">
            {{skill.name}}
        </h3>
        <p class="text-sm font-normal text-gray-700">{{skill.level}}</p>
    </div>
    }
</div>
